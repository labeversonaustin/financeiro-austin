<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financeiro · Austin</title>
<style>
  :root {
    --navy: #1a2e5a;
    --navy-mid: #1e3a72;
    --navy-light: #234080;
    --gold: #c9a84c;
    --gold-light: #b8922e;
    --gold-dim: #8a6e30;
    --cream: #f8f5ef;
    --white: #ffffff;
    --bg: #f4f6fa;
    --bg-card: #ffffff;
    --bg-input: #f8f9fc;
    --border: #e2e8f0;
    --text-main: #1a2e5a;
    --text-sub: #64748b;
    --text-muted: #94a3b8;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-400: #94a3b8;
    --gray-600: #475569;
    --gray-800: #1e293b;
    --green: #16a34a;
    --green-bg: #dcfce7;
    --red: #dc2626;
    --red-bg: #fee2e2;
    --yellow: #d97706;
    --yellow-bg: #fef3c7;
    --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-main);
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    font-size: 14px;
  }

  /* LAYOUT */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    background: var(--navy);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    z-index: 100;
    border-right: none;
    box-shadow: 2px 0 12px rgba(26,46,90,0.12);
  }
  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid rgba(201,168,76,0.12);
  }
  .sidebar-logo .clinic-name {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .sidebar-logo .unit {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 2px;
  }
  .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; }
  .nav-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    padding: 14px 20px 6px;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 20px;
    cursor: pointer;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    transition: all 0.15s;
    border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.04); }
  .nav-item.active {
    color: var(--gold-light);
    background: rgba(201,168,76,0.08);
    border-left-color: var(--gold);
  }
  .nav-item .nav-icon { font-size: 15px; width: 18px; text-align: center; }

  .main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
  .topbar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .topbar-title { font-size: 16px; font-weight: 600; color: var(--text-main); }
  .topbar-sub { font-size: 12px; color: var(--gray-400); margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .month-selector {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    color: var(--text-main);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font-main);
  }
  .month-selector:focus { outline: 1px solid var(--navy); }

  .content { flex: 1; padding: 28px 32px; }

  /* CARDS */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(26,46,90,0.06);
  }
  .card-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(201,168,76,0.2);
  }

  /* GRID */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; }

  /* STAT CARDS */
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: 0 1px 3px rgba(26,46,90,0.06);
  }
  .stat-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; font-weight:500; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; }
  .stat-value.green { color: #4ade80; }
  .stat-value.red { color: #f87171; }
  .stat-value.gold { color: var(--gold-light); }
  .stat-sub { font-size: 11px; color: var(--gray-400); margin-top: 4px; }

  /* FORMS */
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .form-group.w-auto { flex: 0 0 auto; }
  .form-label { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.06em; }
  .form-input, .form-select, .form-textarea {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    color: var(--text-main);
    font-size: 13px;
    font-family: var(--font-main);
    transition: border-color 0.15s;
    width: 100%;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--navy);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(26,46,90,0.08);
  }
  .form-input::placeholder { color: var(--text-muted); }
  .form-select option { background: var(--white); color: var(--text-main); }
  .form-input.auto-filled { border-color: var(--gold); background: #fdf8ee; }
  .form-input.error { border-color: var(--red); }

  /* UPLOAD ZONE */
  .upload-zone {
    border: 2px dashed rgba(201,168,76,0.3);
    border-radius: 10px;
    padding: 28px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: rgba(201,168,76,0.03);
    position: relative;
  }
  .upload-zone:hover { border-color: var(--gold); background: rgba(201,168,76,0.07); }
  .upload-zone.has-file { border-color: var(--gold); border-style: solid; }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-text { font-size: 13px; color: rgba(255,255,255,0.55); }
  .upload-text strong { color: var(--gold); }
  .upload-hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; }

  /* BUTTONS */
  .btn {
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: var(--font-main);
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .btn-primary {
    background: var(--gold);
    color: var(--navy);
  }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-secondary {
    background: var(--gray-100);
    color: var(--text-main);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--gray-200); }
  .btn-danger {
    background: rgba(220,38,38,0.15);
    color: #f87171;
    border: 1px solid rgba(220,38,38,0.3);
  }
  .btn-danger:hover { background: rgba(220,38,38,0.25); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }

  /* DIFF BADGE */
  .diff-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .diff-ok { background: rgba(22,163,74,0.15); color: #4ade80; border: 1px solid rgba(22,163,74,0.3); }
  .diff-warn { background: rgba(217,119,6,0.15); color: #fbbf24; border: 1px solid rgba(217,119,6,0.3); }
  .diff-err { background: rgba(220,38,38,0.15); color: #f87171; border: 1px solid rgba(220,38,38,0.3); }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-sub);
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: var(--gray-100);
  }
  td {
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-main);
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  tr:hover td { background: var(--gray-100); }
  .td-num { text-align: right; font-variant-numeric: tabular-nums; }
  .td-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  /* DRE */
  .dre-section-header td {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    padding-top: 18px;
    padding-bottom: 6px;
  }
  .dre-sub td { color: var(--text-main); padding-left: 28px; }
  .dre-sub-sub td { color: var(--text-sub); padding-left: 44px; font-size: 12px; }
  .dre-total td { font-weight: 700; border-top: 1px solid var(--border); background: var(--gray-100); }
  .dre-margin td { font-size: 16px; font-weight: 800; border-top: 2px solid var(--gold); padding-top: 14px; background: #fdf8ee; }

  /* ALERTS */
  .alert {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .alert-warn { background: rgba(217,119,6,0.12); border: 1px solid rgba(217,119,6,0.3); color: #fbbf24; }
  .alert-err { background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); color: #f87171; }
  .alert-ok { background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.3); color: #4ade80; }

  /* TABS */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab {
    padding: 9px 16px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-sub);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s;
    font-weight: 500;
  }
  .tab:hover { color: var(--text-main); }
  .tab.active { color: var(--gold-light); border-bottom-color: var(--gold); }

  /* SPINNER */
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* LOGIN */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: var(--bg);
  }
  .login-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 48px;
    width: 380px;
    box-shadow: 0 8px 32px rgba(26,46,90,0.12);
  }
  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }
  .login-logo .title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .login-logo .sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .login-logo .icon { font-size: 36px; margin-bottom: 12px; }

  /* SECTION separator */
  .section-sep {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  /* Loading overlay */
  .loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8,15,30,0.85);
    z-index: 999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  .loading-overlay.active { display: flex; }
  .loading-text { font-size: 14px; color: var(--gold-light); }

  /* Toast */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    animation: slideIn 0.25s ease;
    max-width: 320px;
  }
  .toast-ok { background: #166534; color: #bbf7d0; border: 1px solid #16a34a; }
  .toast-err { background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* Maristela return indicator */
  .return-indicator {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-radius: 8px;
    margin-top: 8px;
  }
  .return-positive { background: rgba(22,163,74,0.12); border: 1px solid rgba(22,163,74,0.3); }
  .return-negative { background: rgba(220,38,38,0.12); border: 1px solid rgba(220,38,38,0.3); }
  .return-neutral { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); }

  /* Misc */
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .text-gold { color: var(--gold-light); }
  .text-muted { color: var(--gray-400); }
  .text-right { text-align: right; }
  .flex { display: flex; align-items: center; gap: 8px; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; }
  .mb-8 { margin-bottom: 8px; }
  .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; }
  .hidden { display: none !important; }
  .badge-pgto {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-din { background: rgba(201,168,76,0.15); color: var(--gold-light); }
  .badge-pix { background: rgba(99,102,241,0.2); color: #a5b4fc; }
  .badge-cre { background: rgba(16,185,129,0.15); color: #6ee7b7; }
  .badge-deb { background: rgba(59,130,246,0.15); color: #93c5fd; }
</style>
</head>

function populateMonthSelector() {
  const sel = document.getElementById('globalMonth');
  sel.innerHTML = '';
  const now = new Date();
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const val = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const label = d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = label.charAt(0).toUpperCase() + label.slice(1);
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  }
  state.currentMonth = sel.value;
}

function onMonthChange() {
  state.currentMonth = document.getElementById('globalMonth').value;
  showPage(state.currentPage);
}

async function loadAllData() {
  showLoading('Carregando dados...');
  return new Promise((resolve) => {
    const callbackName = 'cb_' + Date.now();
    const script = document.createElement('script');
    const timeout = setTimeout(() => {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      hideLoading();
      resolve();
    }, 15000);
    window[callbackName] = (json) => {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.remove();
      if (json && json.data) Object.assign(state.data, json.data);
      hideLoading();
      resolve();
    };
    script.src = CONFIG.SHEET_URL + '?action=getAll&callback=' + callbackName;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[callbackName];
      hideLoading();
      resolve();
    };
    document.head.appendChild(script);
  });
}

async function saveRecord(table, record) {
  return new Promise((resolve) => {
    const callbackName = 'save_' + Date.now();
    const script = document.createElement('script');
    const payload = encodeURIComponent(JSON.stringify({ action: 'save', table, record }));
    const timeout = setTimeout(() => {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      // save locally as fallback
      state.data[table] = state.data[table] || [];
      state.data[table].push({ ...record, id: Date.now() });
      resolve(true);
    }, 10000);
    window[callbackName] = (json) => {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.remove();
      const id = (json && json.id) ? json.id : Date.now();
      state.data[table] = state.data[table] || [];
      state.data[table].push({ ...record, id });
      resolve(true);
    };
    script.src = CONFIG.SHEET_URL + '?callback=' + callbackName + '&payload=' + payload;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[callbackName];
      state.data[table] = state.data[table] || [];
      state.data[table].push({ ...record, id: Date.now() });
      resolve(true);
    };
    document.head.appendChild(script);
  });
}

async function deleteRecord(table, id) {
  return new Promise((resolve) => {
    const callbackName = 'del_' + Date.now();
    const script = document.createElement('script');
    const payload = encodeURIComponent(JSON.stringify({ action: 'delete', table, id }));
    const timeout = setTimeout(() => {
      delete window[callbackName];
      if (script.parentNode) script.remove();
      state.data[table] = (state.data[table] || []).filter(r => r.id != id);
      resolve();
    }, 10000);
    window[callbackName] = () => {
      clearTimeout(timeout);
      delete window[callbackName];
      if (script.parentNode) script.remove();
      state.data[table] = (state.data[table] || []).filter(r => r.id != id);
      resolve();
    };
    script.src = CONFIG.SHEET_URL + '?callback=' + callbackName + '&payload=' + payload;
    script.onerror = () => {
      clearTimeout(timeout);
      delete window[callbackName];
      state.data[table] = (state.data[table] || []).filter(r => r.id != id);
      resolve();
    };
    document.head.appendChild(script);
  });
}

// CLAUDE API — extract Labol report
// ============================================================
async function extractLabolData(imageBase64) {
  showLoading('Lendo relatório com IA...');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'image',
              source: { type: 'base64', media_type: 'image/jpeg', data: imageBase64 }
            },
            {
              type: 'text',
              text: `Este é um relatório de caixa do sistema Labol de uma clínica médica brasileira.
Extraia EXATAMENTE os seguintes valores do rodapé/totais do relatório e responda SOMENTE em JSON válido, sem markdown:
{
  "total_servicos": número,
  "descontos": número,
  "a_receber": número,
  "dinheiro": número,
  "pix": número,
  "credito": número,
  "debito": número,
  "data": "DD/MM/AAAA"
}
Use 0 para campos não encontrados. Não inclua texto extra, apenas o JSON.`
            }
          ]
        }]
      })
    });
    const json = await res.json();
    const text = json.content?.[0]?.text || '{}';
    const parsed = JSON.parse(text.replace(/```json|```/g,'').trim());
    hideLoading();
    return parsed;
  } catch(e) {
    hideLoading();
    showToast('Erro ao ler imagem. Preencha manualmente.', 'err');
    return null;
  }
}

// ============================================================
// HELPERS
// ============================================================
function fmt(v) {
  if (v === undefined || v === null || v === '') return '—';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtR(v) { return 'R$ ' + fmt(v); }

function monthLabel(ym) {
  if (!ym) return '';
  const [y, m] = ym.split('-');
  const d = new Date(parseInt(y), parseInt(m)-1, 1);
  return d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
}

function filterByMonth(arr, field, ym) {
  if (!ym) return arr;
  return (arr || []).filter(r => {
    const val = String(r[field] || '');
    // handles "2026-01", "2026-01-02", "2026-01-02T03:00:00.000Z"
    return val.startsWith(ym);
  });
}

function sumField(arr, field) {
  return (arr || []).reduce((a, r) => a + (parseFloat(r[field]) || 0), 0);
}

function getDiasUteisNoMes(ym) {
  if (!ym) return 22;
  const [y, m] = ym.split('-').map(Number);
  let count = 0;
  const days = new Date(y, m, 0).getDate();
  for (let d = 1; d <= days; d++) {
    const dow = new Date(y, m-1, d).getDay();
    if (dow !== 0 && dow !== 6) count++;
  }
  return count;
}

function badgePgto(p) {
  const map = { 'Dinheiro':'din', 'PIX':'pix', 'Crédito':'cre','Cartão de crédito':'cre',
    'Débito':'deb','Cartão de débito':'deb', 'Pix':'pix' };
  const cls = map[p] || 'din';
  return `<span class="badge-pgto badge-${cls}">${p||''}</span>`;
}

function showLoading(txt) {
  document.getElementById('loadingText').textContent = txt || 'Processando...';
  document.getElementById('loadingOverlay').classList.add('active');
}
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }

function showToast(msg, type='ok') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function renderDRE(m) {
  const caixa = filterByMonth(state.data.caixa, 'competencia', m);
  const medicas = filterByMonth(state.data.medicas, 'competencia', m);
  const conv = filterByMonth(state.data.convenios, 'competencia', m);
  const desp = filterByMonth(state.data.despesas_mensais, 'competencia', m);
  const sal = filterByMonth(state.data.salarios, 'competencia', m);

  // Receitas
  const labDin = sumField(caixa, 'blocoA_dinheiro');
  const labPix = sumField(caixa, 'blocoA_pix');
  const labCre = sumField(caixa, 'blocoA_credito');
  const labDeb = sumField(caixa, 'blocoA_debito');
  const labTotal = labDin + labPix + labCre + labDeb;

  // Consultório — vem das consultas da Maristela
  const maristela = medicas.filter(r => r.medica === 'Maristela');
  const consDin = sumField(maristela.filter(r=>r.pgto==='Dinheiro'), 'valor_consulta');
  const consPix = sumField(maristela.filter(r=>r.pgto==='PIX'), 'valor_consulta');
  const consCre = sumField(maristela.filter(r=>r.pgto==='Crédito'||r.pgto==='Cartão de crédito'), 'valor_consulta');
  const consDeb = sumField(maristela.filter(r=>r.pgto==='Débito'||r.pgto==='Cartão de débito'), 'valor_consulta');
  const consTotal = consDin + consPix + consCre + consDeb;

  // Convênios
  const convUni = sumField(conv.filter(r=>r.convenio==='UNIMED'), 'valor');
  const convPos = sumField(conv.filter(r=>r.convenio==='POSTAL SAÚDE'), 'valor');
  const convBra = sumField(conv.filter(r=>r.convenio==='BRADESCO SAÚDE'), 'valor');
  const convApp = sumField(conv.filter(r=>r.convenio==='APPAI'), 'valor');
  const convCac = sumField(conv.filter(r=>r.convenio==='CAC-CEDAE'), 'valor');
  const convCap = sumField(conv.filter(r=>r.convenio==='CAPE SAÚDE'), 'valor');
  const convSau = sumField(conv.filter(r=>r.convenio==='SAÚDE CAIXA'), 'valor');
  const convTotal = convUni+convPos+convBra+convApp+convCac+convCap+convSau;

  const totalReceitas = labTotal + consTotal + convTotal;

  // Despesas fixas
  const getDesp = (cat) => sumField(desp.filter(r=>r.categoria===cat), 'valor');
  const folha = sumField(sal, 'salario') + sumField(sal,'bonus');
  const vt = sumField(sal, 'vt');
  const almoco = sumField(filterByMonth(state.data.almoco,'competencia',m), 'total');
  const aluguel = getDesp('Aluguel'), luz = getDesp('Luz'), internet = getDesp('Internet');
  const encargos = getDesp('Encargos salariais'), sindicato = getDesp('Sindicato');
  const simples = getDesp('Simples Nacional'), taxas = getDesp('Taxas prefeitura');
  const coleta = getDesp('Coleta seletiva'), monit = getDesp('Monitoramento');
  const uber = getDesp('Uber');
  const totalFixas = aluguel+luz+internet+folha+vt+almoco+encargos+sindicato+simples+uber+taxas+coleta+monit;

  // Despesas variáveis
  const repEcg = getDesp('Repasse ECG');
  const repLeticia = sumField(medicas.filter(r=>r.medica==='Leticia'), 'repasse_medica');
  const repVictoria = getDesp('Repasse Dra. Victória');
  const repFabiano = getDesp('Repasse Dr. Fabiano');
  const repMaristela = CONFIG.PLANTAO_MARISTELA;
  const convEv = getDesp('Convênio Everson');
  const ctraprova = getDesp('Contraprova - Boleto');
  const ctradesc = getDesp('Contraprova - Desc. na fonte');
  const difPardini = getDesp('Diferença DB/Pardini');
  const variados = getDesp('Variados');
  const totalVariaveis = repEcg+repLeticia+repVictoria+repFabiano+repMaristela+convEv+ctraprova+ctradesc+difPardini+variados;

  const totalDespesas = totalFixas + totalVariaveis;
  const margem = totalReceitas - totalDespesas;
  const margPct = totalReceitas > 0 ? (margem/totalReceitas*100).toFixed(1) : '0.0';
  const margClass = margem >= 0 ? 'green' : 'red';

  return `
  <div class="grid-4 mb-16">
    <div class="stat-card">
      <div class="stat-label">Total Receitas</div>
      <div class="stat-value gold">${fmtR(totalReceitas)}</div>
      <div class="stat-sub">${monthLabel(m)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Despesas</div>
      <div class="stat-value">${fmtR(totalDespesas)}</div>
      <div class="stat-sub">Fixas + Variáveis</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Margem Final</div>
      <div class="stat-value ${margClass}">${fmtR(margem)}</div>
      <div class="stat-sub">${margPct}% da receita</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Dias com Caixa</div>
      <div class="stat-value">${caixa.length}</div>
      <div class="stat-sub">lançamentos no mês</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Demonstrativo de Resultado</div>
    <div class="table-wrap">
    <table>
      <tr class="dre-section-header"><td colspan="2">RECEITAS</td></tr>

      <tr class="dre-sub"><td>Laboratório</td><td class="td-num text-gold">${fmtR(labTotal)}</td></tr>
      <tr class="dre-sub-sub"><td>Dinheiro</td><td class="td-num">${fmtR(labDin)}</td></tr>
      <tr class="dre-sub-sub"><td>PIX</td><td class="td-num">${fmtR(labPix)}</td></tr>
      <tr class="dre-sub-sub"><td>Crédito</td><td class="td-num">${fmtR(labCre)}</td></tr>
      <tr class="dre-sub-sub"><td>Débito</td><td class="td-num">${fmtR(labDeb)}</td></tr>

      <tr class="dre-sub"><td>Consultório (Dra. Maristela)</td><td class="td-num text-gold">${fmtR(consTotal)}</td></tr>
      <tr class="dre-sub-sub"><td>Dinheiro</td><td class="td-num">${fmtR(consDin)}</td></tr>

// ============================================================
function renderDREAnual(m) {
  const year = (m || state.currentMonth).substring(0, 4);
  const allMonths = ['01','02','03','04','05','06','07','08','09','10','11','12'];
  const monthLabels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  // Collect data for all months in the year
  const monthsData = allMonths.map((mo, idx) => {
    const ym = `${year}-${mo}`;
    const caixa = filterByMonth(state.data.caixa, 'competencia', ym);
    const medicas = filterByMonth(state.data.medicas, 'competencia', ym);
    const conv = filterByMonth(state.data.convenios, 'competencia', ym);
    const desp = filterByMonth(state.data.despesas_mensais, 'competencia', ym);
    const sal = filterByMonth(state.data.salarios, 'competencia', ym);

    const labTotal = sumField(caixa,'blocoA_dinheiro')+sumField(caixa,'blocoA_pix')+sumField(caixa,'blocoA_credito')+sumField(caixa,'blocoA_debito');
    const maristela = medicas.filter(r=>r.medica==='Maristela');
    const consTotal = sumField(maristela,'valor_consulta');
    const convTotal = sumField(conv,'valor');
    const totalReceitas = labTotal + consTotal + convTotal;

    const getD = (cat) => sumField(desp.filter(r=>r.categoria===cat),'valor');
    const folha = sumField(sal,'salario')+sumField(sal,'bonus');
    const vt = sumField(sal,'vt');
    const almoco = sumField(filterByMonth(state.data.almoco,'competencia',ym),'total');
    const totalFixas = getD('Aluguel')+getD('Luz')+getD('Internet')+folha+vt+almoco+
      getD('Encargos salariais')+getD('Sindicato')+getD('Simples Nacional')+
      getD('Uber')+getD('Taxas prefeitura')+getD('Coleta seletiva')+getD('Monitoramento');
    const repLeticia = sumField(medicas.filter(r=>r.medica==='Leticia'),'repasse_medica');
    const totalVariaveis = getD('Variados')+getD('Repasse ECG')+repLeticia+
      getD('Repasse Dra. Victória')+getD('Repasse Dr. Fabiano')+
      (totalReceitas>0?CONFIG.PLANTAO_MARISTELA:0)+
      getD('Convênio Everson')+getD('Contraprova - Boleto')+
      getD('Contraprova - Desc. na fonte')+getD('Diferença DB/Pardini');
    const totalDespesas = totalFixas + totalVariaveis;
    const margem = totalReceitas - totalDespesas;
    return { label: monthLabels[idx], ym, labTotal, consTotal, convTotal, totalReceitas, totalFixas, totalVariaveis, totalDespesas, margem, hasDados: totalReceitas > 0 || totalDespesas > 0 };
  });

  const activeMonths = monthsData.filter(m => m.hasDados);
  const totalRec = activeMonths.reduce((a,m)=>a+m.totalReceitas,0);
  const totalDesp = activeMonths.reduce((a,m)=>a+m.totalDespesas,0);
  const totalMarg = totalRec - totalDesp;
  const margPct = totalRec > 0 ? (totalMarg/totalRec*100).toFixed(1) : '0.0';

  // Year selector
  const now = new Date();
  const years = [];
  for (let y = now.getFullYear(); y >= 2024; y--) years.push(y);
  const yearOpts = years.map(y => `<option value="${y}" ${y==year?'selected':''}>${y}</option>`).join('');

  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <span style="font-size:13px;color:var(--text-sub)">Ano:</span>
    <select class="month-selector" onchange="switchYear(this.value)" style="width:100px">
      ${yearOpts}
    </select>
  </div>

  <div class="grid-4 mb-16">
    <div class="stat-card">
      <div class="stat-label">Total Receitas ${year}</div>
      <div class="stat-value" style="color:#1a2e5a">${fmtR(totalRec)}</div>
      <div class="stat-sub">${activeMonths.length} meses com dados</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Despesas ${year}</div>
      <div class="stat-value" style="color:var(--red)">${fmtR(totalDesp)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Margem Anual</div>
      <div class="stat-value" style="color:${totalMarg>=0?'var(--green)':'var(--red)'}">${fmtR(totalMarg)}</div>
      <div class="stat-sub">${margPct}% da receita</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ticket Médio Mensal</div>
      <div class="stat-value" style="color:var(--gold-light)">${activeMonths.length>0?fmtR(totalRec/activeMonths.length):'—'}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Resultado por Mês — ${year}</div>
    <div class="table-wrap"><table>
      <tr>
        <th>Mês</th>
        <th class="td-num">Laboratório</th>
        <th class="td-num">Consultório</th>
        <th class="td-num">Convênios</th>
        <th class="td-num">Total Rec.</th>
        <th class="td-num">Total Desp.</th>
        <th class="td-num">Margem</th>
        <th class="td-num">%</th>
      </tr>
      ${monthsData.map(m => {
        if (!m.hasDados) return `<tr><td style="color:var(--text-muted)">${m.label}</td><td colspan="7" style="color:var(--text-muted);text-align:center;font-size:12px">sem dados</td></tr>`;
        const pct = m.totalReceitas > 0 ? (m.margem/m.totalReceitas*100).toFixed(1) : '0.0';
        const mColor = m.margem >= 0 ? 'var(--green)' : 'var(--red)';
        return `<tr>
          <td style="font-weight:600">${m.label}</td>
          <td class="td-num">${fmtR(m.labTotal)}</td>
          <td class="td-num">${fmtR(m.consTotal)}</td>
          <td class="td-num">${fmtR(m.convTotal)}</td>
          <td class="td-num" style="font-weight:600;color:#1a2e5a">${fmtR(m.totalReceitas)}</td>
          <td class="td-num" style="color:var(--red)">${fmtR(m.totalDespesas)}</td>
          <td class="td-num" style="font-weight:700;color:${mColor}">${fmtR(m.margem)}</td>
          <td class="td-num" style="color:${mColor}">${pct}%</td>
        </tr>`;
      }).join('')}
      <tr style="font-weight:800;border-top:2px solid var(--gold);background:#fdf8ee">
        <td>TOTAL</td>
        <td class="td-num">${fmtR(activeMonths.reduce((a,m)=>a+m.labTotal,0))}</td>
        <td class="td-num">${fmtR(activeMonths.reduce((a,m)=>a+m.consTotal,0))}</td>
        <td class="td-num">${fmtR(activeMonths.reduce((a,m)=>a+m.convTotal,0))}</td>
        <td class="td-num" style="color:#1a2e5a">${fmtR(totalRec)}</td>
        <td class="td-num" style="color:var(--red)">${fmtR(totalDesp)}</td>
        <td class="td-num" style="color:${totalMarg>=0?'var(--green)':'var(--red)'}">${fmtR(totalMarg)}</td>
        <td class="td-num" style="color:${totalMarg>=0?'var(--green)':'var(--red)'}">${margPct}%</td>
      </tr>
    </table></div>
  </div>`;
}

async function handleLabFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('uploadZone').classList.add('has-file');
  const reader = new FileReader();
  reader.onload = async (e) => {
    const base64 = e.target.result.split(',')[1];
    const data = await extractLabolData(base64);
    if (data) {
      const fields = {
        cx_total: data.total_servicos, cx_desc: data.descontos,
        cx_aberto: data.a_receber, cx_din: data.dinheiro,
        cx_pix: data.pix, cx_cre: data.credito, cx_deb: data.debito
      };
      Object.entries(fields).forEach(([id, val]) => {
        const el = document.getElementById(id);
        if (el && val !== undefined && val !== null) {
          el.value = val || '';
          el.classList.add('auto-filled');
        }
      });
      if (data.data) {
        const parts = data.data.split('/');
        if (parts.length === 3) document.getElementById('cx_data').value = `${parts[2]}-${parts[1]}-${parts[0]}`;
      }
      document.getElementById('extractStatus').innerHTML = `<div class="alert alert-ok">✅ Dados extraídos com sucesso. Confira e corrija se necessário.</div>`;
      document.getElementById('extractStatus').classList.remove('hidden');
      calcDiff();
      showToast('Relatório lido com sucesso!', 'ok');
    }
  };
  reader.readAsDataURL(file);
}

function calcDiff() {
  const g = id => parseFloat(document.getElementById(id)?.value || 0) || 0;
  const sistDin = g('cx_din'), sistPix = g('cx_pix'), sistCre = g('cx_cre'), sistDeb = g('cx_deb');
  const sistTotal = sistDin + sistPix + sistCre + sistDeb;
  const compDin = g('cb_din'), compPix = g('cb_pix');
  const compCre = g('cb_cre') + g('cb_cre_toxi');
  const compDeb = g('cb_deb') + g('cb_deb_toxi');
  const almBeat = g('alm_beatriz'), almIsab = g('alm_isabelle'), almViv = g('alm_viviane'), almRita = g('alm_rita');
  const uber = g('cb_uber'), outras = g('cb_outras');
  const saidas = almBeat + almIsab + almViv + almRita + uber + outras;
  const compTotal = compDin + compPix + compCre + compDeb + saidas;
  const diff = sistTotal - compTotal;
  const badge = document.getElementById('diffBadge');
  const justWrap = document.getElementById('justificativaWrap');
  const absDiff = Math.abs(diff);
  badge.textContent = `${diff >= 0 ? '✓' : '!'} R$ ${fmt(diff)}`;
  badge.className = 'diff-badge ' + (absDiff < 0.05 ? 'diff-ok' : absDiff <= 5 ? 'diff-warn' : 'diff-err');
  if (absDiff > 5) justWrap.classList.remove('hidden');
  else justWrap.classList.add('hidden');
}

function clearCaixa() {
  ['cx_data','cx_total','cx_desc','cx_aberto','cx_din','cx_pix','cx_cre','cx_deb',
   'cb_din','cb_pix','cb_cre','cb_deb','cb_cre_toxi','cb_deb_toxi',
   'alm_beatriz','alm_isabelle','alm_viviane','alm_rita','cb_uber','cb_outras','cb_outras_desc','cb_justificativa']
  .forEach(id => { const el = document.getElementById(id); if(el){el.value='';el.classList.remove('auto-filled');} });
  document.getElementById('extractStatus').classList.add('hidden');
  document.getElementById('uploadZone').classList.remove('has-file');
  document.getElementById('justificativaWrap').classList.add('hidden');
  calcDiff();
}

async function saveCaixa() {
  const g = id => parseFloat(document.getElementById(id)?.value || 0) || 0;
  const gs = id => document.getElementById(id)?.value || '';
  const data = gs('cx_data');
  if (!data) { showToast('Informe a data', 'err'); return; }
  const diff = g('cx_din')+g('cx_pix')+g('cx_cre')+g('cx_deb') -
    (g('cb_din')+g('cb_pix')+g('cb_cre')+g('cb_cre_toxi')+g('cb_deb')+g('cb_deb_toxi')+
     g('alm_beatriz')+g('alm_isabelle')+g('alm_viviane')+g('cb_uber')+g('cb_outras'));
  if (Math.abs(diff) > 5 && !gs('cb_justificativa')) {
    showToast('Preencha a justificativa para a divergência', 'err'); return;
  }
  const record = {
    data, competencia: data.substring(0,7),
    blocoA_total: g('cx_total'), blocoA_desconto: g('cx_desc'), blocoA_aberto: g('cx_aberto'),
    blocoA_dinheiro: g('cx_din'), blocoA_pix: g('cx_pix'), blocoA_credito: g('cx_cre'), blocoA_debito: g('cx_deb'),
    blocoB_dinheiro: g('cb_din'), blocoB_pix: g('cb_pix'), blocoB_credito: g('cb_cre'), blocoB_debito: g('cb_deb'),
    blocoB_cre_toxi: g('cb_cre_toxi'), blocoB_deb_toxi: g('cb_deb_toxi'),
    alm_beatriz: g('alm_beatriz'), alm_isabelle: g('alm_isabelle'), alm_viviane: g('alm_viviane'), alm_rita: g('alm_rita'),
    uber: g('cb_uber'), outras_saidas: g('cb_outras'), outras_desc: gs('cb_outras_desc'),
    diferenca: diff, justificativa: gs('cb_justificativa'),
    timestamp: new Date().toISOString()
  };
  showLoading('Salvando...');
  await saveRecord('caixa', record);
  // save almoco separately
  for (const f of CONFIG.FUNCIONARIAS) {
    const val = g(`alm_${f.toLowerCase()}`);
    if (val > 0) {
      await saveRecord('almoco', { data, competencia: data.substring(0,7), funcionaria: f, valor: val, total: val });
    }
  }
  hideLoading();
  showToast('Caixa salvo com sucesso!', 'ok');
  clearCaixa();
}

  document.getElementById(show).classList.remove('hidden');
  document.getElementById(hide).classList.add('hidden');
  el.closest('.tabs').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}
function calcRepasseLeticia() {

  state.data.despesas_mensais = (state.data.despesas_mensais||[]).filter(r=>!(r.competencia===m && cats.includes(r.categoria)));

}

function renderSalarios(m) {
  const rows = filterByMonth(state.data.salarios, 'competencia', m);

  const getF = (f, field) => {
    const r = rows.find(x=>x.funcionaria===f);
    return r ? (r[field]||'') : '';
  };
  const diasUteis = getDiasUteisNoMes(m);
  return `

    </div>
    <div class="table-wrap"><table>
      <tr>
        <th>Funcionária</th>
        <th class="td-num">Salário</th>
        <th class="td-num">Bônus</th>
        <th class="td-num">VT (auto)</th>

      </tr>

      <tr>
        <td style="font-weight:600">${f}</td>
        <td><input type="number" id="sal_${f}_sal" class="form-input" style="max-width:120px" placeholder="0,00" step="0.01" value="${getF(f,'salario')}" oninput="calcSalTotal('${f}')"></td>
        <td><input type="number" id="sal_${f}_bon" class="form-input" style="max-width:100px" placeholder="0,00" step="0.01" value="${getF(f,'bonus')}" oninput="calcSalTotal('${f}')"></td>
        <td id="sal_${f}_vt_display" style="text-align:right;color:var(--gray-400)">${fmtR((CONFIG.PASSAGENS[f]||0)*diasUteis*2)}</td>
        <td><input type="number" id="sal_${f}_ref" class="form-input" style="max-width:100px" placeholder="0,00" step="0.01" value="${getF(f,'refeicao')||1260}"></td>
        <td id="sal_${f}_total" class="td-num text-gold" style="font-weight:700">—</td>
      </tr>`).join('')}
    </table></div>
    <div class="divider"></div>
    <div class="flex-between">
      <div>
        <div style="font-size:12px;color:var(--gray-400)">Total Folha</div>
        <div style="font-size:20px;font-weight:700;color:var(--gold-light)" id="salTotalGeral">—</div>
      </div>
      <button class="btn btn-primary" onclick="saveSalarios('${m}')">💾 Salvar Folha</button>
    </div>
  </div>`;
}

function calcDiasUteis() {
  const m = state.currentMonth;
  const funs = ['Beatriz','Isabelle','Viviane'];
  funs.forEach(f => calcSalTotal(f));
  recalcTotal();
}

function recalcVT() {
  const dias = parseInt(document.getElementById('sal_dias')?.value)||0;
  const funs = ['Beatriz','Isabelle','Viviane'];
  funs.forEach(f => {
    const vt = (CONFIG.PASSAGENS[f]||0) * dias * 2;
    const el = document.getElementById(`sal_${f}_vt_display`);
    if (el) el.textContent = fmtR(vt);
    calcSalTotal(f);
  });
}

function calcSalTotal(f) {
  const g = id => parseFloat(document.getElementById(id)?.value||0)||0;
  const dias = parseInt(document.getElementById('sal_dias')?.value)||0;
  const sal = g(`sal_${f}_sal`), bon = g(`sal_${f}_bon`), ref = g(`sal_${f}_ref`);
  const vt = (CONFIG.PASSAGENS[f]||0)*dias*2;
  const total = sal+bon+vt+ref;
  const el = document.getElementById(`sal_${f}_total`);
  if (el) el.textContent = fmtR(total);
  recalcTotal();
}

function recalcTotal() {
  const funs = ['Beatriz','Isabelle','Viviane'];
  let total = 0;
  funs.forEach(f => {
    const g = id => parseFloat(document.getElementById(id)?.value||0)||0;
    const dias = parseInt(document.getElementById('sal_dias')?.value)||0;
    total += g(`sal_${f}_sal`)+g(`sal_${f}_bon`)+(CONFIG.PASSAGENS[f]||0)*dias*2+g(`sal_${f}_ref`);
  });
  const el = document.getElementById('salTotalGeral');
  if (el) el.textContent = fmtR(total);
}

async function saveSalarios(m) {
  const funs = ['Beatriz','Isabelle','Viviane'];
  const dias = parseInt(document.getElementById('sal_dias')?.value)||0;
  state.data.salarios = (state.data.salarios||[]).filter(r=>r.competencia!==m);
  for (const f of funs) {
    const sal = parseFloat(document.getElementById(`sal_${f}_sal`)?.value)||0;
    if (sal > 0) {
      const bon = parseFloat(document.getElementById(`sal_${f}_bon`)?.value)||0;
      const ref = parseFloat(document.getElementById(`sal_${f}_ref`)?.value)||0;
      const vt = (CONFIG.PASSAGENS[f]||0)*dias*2;
      await saveRecord('salarios', { competencia: m, funcionaria: f, salario: sal, bonus: bon, vt, refeicao: ref, dias_uteis: dias });
    }
  }
  showToast('Folha salva!','ok');
}

          <td class="td-num" style="color:${diffColor}">${fmtR(diff)}</td>
          <td><button class="btn btn-danger btn-sm" onclick="delCaixa(${r.id})">✕</button></td>
        </tr>`;
      }).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--gray-400);padding:20px">Nenhum caixa lançado este mês</td></tr>'}
    </table></div>
  </div>`;
}
async function delCaixa(id) {
  if (!confirm('Remover este lançamento?')) return;
  await deleteRecord('caixa', id); showPage('historico');
}

// ============================================================
// PAGE: DIVERGÊNCIAS
// ============================================================
function renderDivergencias(m) {
  const rows = (state.data.caixa||[])
    .filter(r => Math.abs(parseFloat(r.diferenca)||0) > 0.05)
    .sort((a,b)=>b.data.localeCompare(a.data));
  return `
  <div class="card">
    <div class="card-title">Histórico de Divergências</div>
    ${rows.length ? '' : '<div class="alert alert-ok">✅ Nenhuma divergência registrada!</div>'}
    <div class="table-wrap"><table>
      <tr><th>Data</th><th class="td-num">Diferença</th><th>Justificativa</th></tr>
      ${rows.map(r=>{
        const diff = parseFloat(r.diferenca)||0;
        return `<tr>
          <td>${r.data}</td>
          <td class="td-num" style="color:${Math.abs(diff)<=5?'#fbbf24':'#f87171'}">${fmtR(diff)}</td>
          <td style="color:var(--gray-400)">${r.justificativa||'—'}</td>
        </tr>`;
      }).join('')}
    </table></div>
  </div>`;
}
